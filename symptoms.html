<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Narrative - Symptoms</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf6eb;
            color: #111;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 60px auto;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 25px;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            text-align: left;
        }

        label {
            display: block;
            margin: 15px 0;
            font-size: 18px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 17px;
            border-radius: 7px;
            cursor: pointer;
            margin: 10px 5px;
        }

        button:hover {
            background-color: #256628;
        }

        #symptomList {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f5faf5;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            color: #2e7d32;
            font-size: 21px;
            font-weight: bold;
            text-align: center;
        }

        .back-button {
            background-color: #555;
        }

        .back-button:hover {
            background-color: #333;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Health Narrative</h1>

        <h2>Homeopathy Remedy Finder</h2>


        <div class="card">

            <h3>Select Body Part</h3>

            <select id="bodyPart">

                <option value="">-- Select Body Part --</option>

                <option value="Head">Head</option>

                <option value="Eyes">Eyes</option>

                <option value="Ears">Ears</option>

                <option value="Nose">Nose</option>

                <option value="Throat">Throat</option>

                <option value="Chest">Chest</option>

                <option value="Stomach">Stomach</option>

                <option value="Skin">Skin</option>

                <option value="Back">Back</option>

                <option value="Legs">Legs</option>

            </select>


            <button onclick="loadSymptoms()">
                Load Symptoms
            </button>


            <h3>Select Your Symptoms</h3>

            <div id="symptomList">

                Select a body part to load symptoms.

            </div>


            <div style="text-align:center;">

                <button onclick="findRemedy()">
                    Find Remedy
                </button>

                <button
                    class="back-button"
                    onclick="window.location.href='index.html'">
                    Back
                </button>

            </div>


            <h3 id="result"></h3>

        </div>

    </div>


    <!-- Firebase + Symptoms JavaScript -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getDatabase,
            ref,
            get
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // =====================================
        // FIREBASE CONFIGURATION
        // =====================================

        const firebaseConfig = {

            apiKey: "AIzaSyBRFfsMtyzwG0xbLI9k90perHJeSdJPAhU",
            authDomain: "healthnarrative-c4af3.firebaseapp.com",
            databaseURL: "https://healthnarrative-c4af3-default-rtdb.firebaseio.com",
            projectId: "healthnarrative-c4af3",
            storageBucket: "healthnarrative-c4af3.firebasestorage.app",
            messagingSenderId: "637852726804",
            appId: "1:637852726804:web:ea41a628ff1cef57341901",

        };


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        // =====================================
        // LOAD SYMPTOMS
        // =====================================

        async function loadSymptoms() {

            try {

                const part =
                    document.getElementById("bodyPart").value;


                if (part === "") {

                    document.getElementById("symptomList").innerHTML =
                        "Please select a body part.";

                    return;
                }


                const dbRef =
                    ref(database, "symptoms");


                const snapshot =
                    await get(dbRef);


                let html = "";


                if (snapshot.exists()) {

                    const data = snapshot.val();


                    for (let key in data) {

                        if (data[key].category === part) {

                            html +=
                                '<label>' +

                                '<input type="checkbox" value="' +
                                data[key].remedy +
                                '">' +

                                data[key].symptom +

                                '</label>';
                        }
                    }


                    if (html === "") {

                        html =
                            "No symptoms found for " + part + ".";

                    }


                    document.getElementById("symptomList")
                        .innerHTML = html;


                } else {

                    document.getElementById("symptomList")
                        .innerHTML =
                        "No symptoms found in Firebase.";

                }


            } catch (error) {

                console.error(
                    "Firebase Error:",
                    error
                );


                document.getElementById("symptomList")
                    .innerHTML =
                    "Firebase Error: " +
                    error.message;

            }

        }


        // =====================================
        // FIND REMEDY
        // =====================================

        function findRemedy() {

            const checked =
                document.querySelectorAll(
                    "#symptomList input:checked"
                );


            if (checked.length === 0) {

                document.getElementById("result")
                    .innerHTML =
                    "Please select at least one symptom.";

                return;
            }


            let count = {};


            checked.forEach(function(item) {

                const remedy =
                    item.value;


                count[remedy] =
                    (count[remedy] || 0) + 1;

            });


            let best = "";

            let max = 0;


            for (let remedy in count) {

                if (count[remedy] > max) {

                    max =
                        count[remedy];

                    best =
                        remedy;
                }

            }


            document.getElementById("result")
                .innerHTML =
                "Suggested Remedy : " + best;

        }


        // Make functions available
        // to onclick buttons

        window.loadSymptoms =
            loadSymptoms;

        window.findRemedy =
            findRemedy;

    </script>


</body>

</html>
